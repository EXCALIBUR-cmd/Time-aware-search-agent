name: CI

on:
  push:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Smoke test better-sqlite3 with FTS5
        shell: bash
        run: |
          node -e "
            const Database = require('better-sqlite3');
            const db = new Database(':memory:');
            db.exec('CREATE VIRTUAL TABLE notes USING fts5(text)');
            db.prepare('INSERT INTO notes (text) VALUES (?)').run('Neon Launch plan is 19 dollars a month');
            const hit = db.prepare('SELECT text FROM notes WHERE notes MATCH ?').get('launch');
            if (!hit) throw new Error('FTS5 query returned nothing');
            const sqlite = db.prepare('SELECT sqlite_version() AS v').get().v;
            console.log('better-sqlite3', require('better-sqlite3/package.json').version, '| SQLite', sqlite, '| FTS5 ok');
          "

      - run: npx tsc --noEmit

      - run: npx vitest run

      - run: npm run build
